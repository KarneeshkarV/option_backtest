[project]
name = "option-backtester-and-stargry"
version = "0.1.0"
description = "Modular intraday NIFTY option backtester on vectorbt with synthetic Black-Scholes premiums."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "screener",
    # Pinned to the 1.0 line on purpose: vectorbt 1.1 requires pandas>=3.0.3 /
    # numpy>=2.4.6 / numba>=0.66, which would force a breaking pandas major into
    # the tree screener is locked and tested against (pandas 2.3.3, numpy 2.4.4,
    # numba 0.65.1, vectorbt 1.0.0). Revisit only when screener itself moves.
    "vectorbt>=1.0,<1.1",
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.13",
]

[tool.uv.sources]
screener = { path = "../screener", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obt"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=2.0",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.5",
    "scipy-stubs>=1.18.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
# `reports/` holds analysis write-ups, not source. Their fenced snippets are
# quoted evidence (circular text, before/after diffs) and must stay verbatim,
# so the Python formatter does not get to rewrite them.
extend-exclude = ["reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
packages = ["obt"]
warn_unused_ignores = true

# Neither screener nor vectorbt ships a py.typed marker, so mypy cannot see
# into them. Silencing the import error is not the same as trusting them: every
# value crossing these boundaries is `Any`, which is exactly why the pricer is
# pinned against screener's scalar oracle in tests rather than by types.
[[tool.mypy.overrides]]
module = ["screener.*", "vectorbt.*"]
ignore_missing_imports = true
